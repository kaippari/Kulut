<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matkailuauton kulut</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2521;--mu:#68716c;--ac:#1f6f5c;--bd:#dcdad3;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141816;--card:#1e2421;--tx:#e8ece9;--mu:#98a29c;--ac:#4cb597;--bd:#333b37;--bad:#f2b8b5}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:14px}h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{display:block;font-size:22px}
.stat span,label,small{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
label{display:block;margin:8px 0 3px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}#md.hide{display:none}
input,select,button,textarea{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hide{display:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px}.chk input{width:auto}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600;margin-top:12px}button.s{margin-top:8px}
.it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.it button{width:auto;padding:4px 10px;color:var(--bad)}
</style></head><body><main>
<h1>Matkailuauton kulut</h1>
<div class="card stats">
 <div class="stat"><b id="today">0</b><span>Tänään (EUR) / <span id="bud">90</span></span><div class="bar"><i id="tb" style="width:0"></i></div></div>
 <div class="stat"><b id="tot">0</b><span>Yhteensä (EUR)</span><div class="bar"><i id="ab" style="width:0"></i></div></div>
 <small id="dg" style="grid-column:1/3"></small>
</div>
<div class="card">
 <div class="row"><div><label>Päivämäärä</label><input type="date" id="d"></div>
 <div><label>Summa</label><input type="number" id="a" inputmode="decimal" step="0.01"></div></div>
 <div class="row"><div><label>Matkamittari km</label><input type="number" id="o" inputmode="numeric"></div>
 <div><label>Maksutapa</label><select id="pm"><option>Kortti</option><option>Käteinen</option></select></div></div>
 <div class="row"><div><label>Luokka</label><select id="c"></select></div>
 <div id="sw"><label>Alaluokka</label><select id="sc"></select></div>
 <div id="lw" class="hide"><label>Litraa</label><input type="number" id="l" inputmode="decimal"></div></div>
 <div class="row"><div><label>Kohde</label><select id="t"></select></div>
 <div><label>Maa</label><select id="k"></select></div></div>
 <label>Kuvaus</label><input id="n">
 <div class="row"><div><label>Valuutta</label><select id="cu"></select></div>
 <div id="rw" class="hide"><label>Kurssi (EUR / 1)</label><input type="number" id="r" inputmode="decimal" step="0.0001"></div></div>
 <div class="chk"><input type="checkbox" id="oo"><span>Kertaluonteinen kulu</span></div>
 <button class="p" id="add">Lisää kulu</button>
 <button class="s" id="ad2">Lisää ja jatka samalta kuitilta</button>
 <button class="s hide" id="er">Lopeta kuitti</button><small id="msg"></small>
</div>
<div class="card"><b>Viimeisimmät</b><div id="list"></div></div>
<div class="card"><b>Tiedot</b>
 <small>Tiedot tallentuvat vain tähän selaimeen. Vie ne säännöllisesti.</small>
 <button class="s" id="sh">Tallenna tiedot tiedostoksi (JSON)</button>
 <button class="s" id="im">Tuo tiedot tiedostosta</button>
 <input type="file" id="fi" accept=".json,application/json" class="hide">
 <button class="s" id="cs">Vie CSV</button>
 <button class="s" id="dn">Muokkaa koirien nimiä</button>
 <button class="s" id="ac">Lisää luokka</button>
 <button class="s" id="ip">Tuo liitetystä tekstistä</button>
 <textarea id="tx" class="hide" style="width:100%;height:100px;margin-top:8px;font-size:12px"></textarea></div>
</main>
<div id="md" class="hide"><div class="card" style="width:100%;max-width:420px;margin:0"><label id="mt"></label><input id="mi">
 <div class="row" style="margin-top:12px"><button id="mc">Peruuta</button><button class="p" id="mo" style="margin-top:0">OK</button></div></div></div>
<script>
var NATIVE=false,FS=null,DL=null;
var KEY="mhk.v2",BUD=90,S;
var CUR=["EUR","GBP","CHF","NOK","SEK","DKK","CZK","PLN","HUF","RON","BGN","ISK","Muu"];
var CTRY=["Portugali","Espanja","Ranska","Andorra","Italia","Sveitsi","Saksa","Itävalta","Belgia","Alankomaat","Luxemburg","Slovenia","Kroatia","Kreikka","Norja","Ruotsi","Tanska","Tšekki","Puola","Unkari","Slovakia","Britannia","Irlanti","Suomi","Muu"];
var DEF={v:2,by:"",dogs:["Koira 1","Koira 2"],items:[],cats:[{n:"Polttoaine",s:[]},{n:"Tiemaksut",s:[]},{n:"Yöpyminen",s:["Leirintäalue","Aire / yöpymisalue","Vapaa yöpyminen"]},{n:"Kaasu, vesi ja sähkö",s:[]},{n:"Ruokakauppa",s:[]},{n:"Ravintolat ja kahvilat",s:[]},{n:"Auton huolto",s:[]},{n:"Vakuutukset",s:[]},{n:"Lautat ja tunnelit",s:[]},{n:"Aktiviteetit",s:[]},{n:"Terveys ja apteekki",s:[]},{n:"Koirat",s:["Ruoka","Eläinlääkäri","Lääkkeet ja rokotukset","Tarvikkeet","Hoito ja majoitus","Koiramaksut"]},{n:"Pyykki",s:[]},{n:"Puhelin ja netti",s:[]},{n:"Varusteet",s:[]},{n:"Muut",s:[]}]};
var $=function(i){return document.getElementById(i)};
function ask(t,v){return new Promise(function(res){$("mt").textContent=t;$("mi").value=v||"";$("md").className="";$("mi").focus();
 function done(x){$("md").className="hide";$("mo").onclick=$("mc").onclick=null;res(x)}
 $("mo").onclick=function(){done($("mi").value)};$("mc").onclick=function(){done(null)}})}
function msg(t){$("msg").textContent=t||""}
async function save(){var j=JSON.stringify(S);try{if(NATIVE)await FS.writeFile({path:"data.json",data:j,directory:"DATA",encoding:"utf8"});else localStorage.setItem(KEY,j)}catch(e){msg("Tallennus epäonnistui.")}}
async function load(){try{if(NATIVE){var r=await FS.readFile({path:"data.json",directory:"DATA",encoding:"utf8"});S=JSON.parse(r.data)}else S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S)S=JSON.parse(JSON.stringify(DEF));
 if(!S.by){S.by=((await ask("Kuka käyttää tätä puhelinta? (nimi)"))||"Puhelin").trim();await save()}}
function opts(id,arr,keep){var e=$(id),v=e.value;e.innerHTML="";arr.forEach(function(x){var o=document.createElement("option");o.textContent=x;e.appendChild(o)});if(keep&&arr.indexOf(v)>=0)e.value=v}
function live(){return S.items.filter(function(x){return!x.del})}
function eur(x){return x.amt*(x.cur==="EUR"?1:(x.rate||0))}
function fmt(n){return n.toLocaleString("fi-FI",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function subs(){var c=S.cats.filter(function(x){return x.n===$("c").value})[0];var s=c?c.s:[];opts("sc",s);$("sw").className=s.length?"":"hide";$("lw").className=$("c").value==="Polttoaine"?"":"hide"}
function setup(){opts("c",S.cats.map(function(x){return x.n}),true);opts("t",["Yhteinen"].concat(S.dogs),true);subs()}
function render(){var t=0,td=0,run=0,dg=0,days={},day=$("d").value;
 live().forEach(function(x){var e=eur(x);t+=e;if(x.date===day)td+=e;if(!x.oo){run+=e;days[x.date]=1}if(x.target&&x.target!=="Yhteinen")dg+=e});
 var nd=Object.keys(days).length;$("tot").textContent=fmt(t);$("today").textContent=fmt(td);$("bud").textContent=BUD;
 $("tb").style.width=Math.min(100,td/BUD*100)+"%";$("ab").style.width=nd?Math.min(100,run/nd/BUD*100)+"%":"0";
 $("dg").textContent="Koirien kulut yhteensä: "+fmt(dg)+" EUR";
 var gs={},gn={};live().forEach(function(x){if(x.rid){gs[x.rid]=(gs[x.rid]||0)+eur(x);gn[x.rid]=(gn[x.rid]||0)+1}});
 var h="";live().slice().reverse().slice(0,15).forEach(function(x){h+='<div class="it"><div><b>'+fmt(x.amt)+" "+esc(x.cur)+"</b> "+esc(x.cat)+(x.sub?" / "+esc(x.sub):"")+"<br><small>"+esc(x.date)+" · "+esc(x.country)+(x.target&&x.target!=="Yhteinen"?" · "+esc(x.target):"")+(x.desc?" · "+esc(x.desc):"")+" · "+esc(x.by)+(x.rid&&gn[x.rid]>1?" · kuitti yht. "+fmt(gs[x.rid])+" EUR ("+gn[x.rid]+" riviä)":"")+"</small></div><button data-id=\""+x.id+"\">✕</button></div>"});
 $("list").innerHTML=h||"<small>Ei vielä kuluja.</small>"}
$("list").onclick=async function(e){var t=e.target,id=t.getAttribute("data-id");if(!id)return;if(t.textContent!=="Poista?"){t.textContent="Poista?";setTimeout(function(){t.textContent="✕"},3000);return}
 S.items.forEach(function(x){if(x.id===id){x.del=true;x.ts=Date.now()}});await save();render()};
var RID=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
async function addItem(more){var a=parseFloat($("a").value),cu=$("cu").value,r=parseFloat($("r").value);
 if(!(a>0))return msg("Syötä summa.");if(cu!=="EUR"&&!(r>0))return msg("Syötä kurssi valuutalle "+cu+".");
 var rid=RID||(more?uid():"");RID=more?rid:null;
 S.items.push({id:uid(),ts:Date.now(),rid:rid,date:$("d").value,amt:a,cur:cu,rate:cu==="EUR"?1:r,cat:$("c").value,sub:$("sw").className?"":$("sc").value,country:$("k").value,desc:$("n").value.trim(),target:$("t").value,oo:$("oo").checked,litres:parseFloat($("l").value)||"",odo:parseFloat($("o").value)||"",pay:$("pm").value,by:S.by});
 try{localStorage.setItem("mhk.last",JSON.stringify({k:$("k").value,cu:cu}))}catch(e){}
 await save();$("a").value="";$("n").value="";$("l").value="";if(!more)$("o").value="";$("oo").checked=false;
 if(more){$("c").selectedIndex=0;$("t").selectedIndex=0;subs();var g=live().filter(function(x){return x.rid===rid});
  msg("Kuitilla "+g.length+" riviä, yhteensä "+fmt(g.reduce(function(t,x){return t+eur(x)},0))+" EUR. Lisää seuraava.")}else msg("");
 $("er").className=RID?"s":"s hide";render();$("a").focus()}
$("add").onclick=function(){addItem(false)};$("ad2").onclick=function(){addItem(true)};
$("er").onclick=function(){RID=null;$("er").className="s hide";msg("Kuitti suljettu.")};
$("c").onchange=subs;$("d").onchange=render;$("cu").onchange=function(){$("rw").className=$("cu").value==="EUR"?"hide":""};
async function shareFile(name,text){if(DL){try{await DL.save({filename:name,data:text});return}catch(e){if(e&&e.code==="declined")return}}
 try{var u=URL.createObjectURL(new Blob([text],{type:/\.csv$/.test(name)?"text/csv":"application/json"}));var l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);msg("Tiedosto ladattu: "+name);return}catch(e){}
 $("tx").className="";$("tx").value=text;$("tx").select();msg("Lataus ei onnistunut – kopioi teksti ruudulta.")}
$("sh").onclick=function(){shareFile("kulut-"+S.by+"-"+iso(new Date())+".json",JSON.stringify({v:2,by:S.by,items:S.items}))};
$("im").onclick=function(){$("fi").click()};
async function imp(txt){try{var d=JSON.parse(txt),add=0,upd=0,m={};
 S.items.forEach(function(x){m[x.id]=x});
 (d.items||[]).forEach(function(x){var o=m[x.id];if(!o){S.items.push(x);add++}else if((x.ts||0)>(o.ts||0)){Object.assign(o,x);upd++}});
 S.items.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts});await save();render();msg("Tuotu: "+add+" uutta, "+upd+" päivitettyä.")}catch(e){msg("Tietoja ei voitu lukea.")}}
$("fi").onchange=async function(){var f=$("fi").files[0];if(f)await imp(await f.text());$("fi").value=""};
$("ip").onclick=function(){if($("tx").className){$("tx").className="";$("tx").value="";$("tx").focus();msg("Liitä tiedot ruudulle ja paina painiketta uudelleen.");return}imp($("tx").value)};
$("cs").onclick=function(){var q=function(v){v=String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 var rows=[["Päivämäärä","Maa","Luokka","Alaluokka","Kuvaus","Summa","Valuutta","Kurssi","Summa EUR","Kohde","Litrat","Matkamittari","Kertaluonteinen","Maksutapa","Kirjaaja","Kuitti"]];
 live().forEach(function(x){rows.push([x.date,x.country,x.cat,x.sub,x.desc,x.amt,x.cur,x.rate,eur(x).toFixed(2),x.target,x.litres,x.odo,x.oo?"K":"",x.pay,x.by,x.rid||""])});
 shareFile("kulut-"+iso(new Date())+".csv",rows.map(function(r){return r.map(q).join(",")}).join("\n"))};
$("dn").onclick=async function(){var v=await ask("Koirien nimet pilkulla erotettuna:",S.dogs.join(", "));if(v===null)return;
 var n=v.split(",").map(function(x){return x.trim()}).filter(Boolean);if(n.length){S.dogs=n;await save();setup()}};
$("ac").onclick=async function(){var v=((await ask("Uuden luokan nimi:"))||"").trim();if(!v)return;S.cats.push({n:v,s:[]});await save();setup();$("c").value=v;subs()};
if(window.claude&&claude.use){claude.use("downloads").then(function(d){DL=d}).catch(function(){})}
(async function(){await load();opts("k",CTRY);opts("cu",CUR);
 try{var l=JSON.parse(localStorage.getItem("mhk.last"));if(l){$("k").value=l.k;$("cu").value=l.cu}}catch(e){}
 $("rw").className=$("cu").value==="EUR"?"hide":"";$("d").value=iso(new Date());setup();render()})();
</script></body></html>
